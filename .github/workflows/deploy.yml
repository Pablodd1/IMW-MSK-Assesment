name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: |
          vercel --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --org=${{ secrets.VERCEL_ORG_ID }} \
            --project=${{ secrets.VERCEL_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify deployment
        run: |
          sleep 15
          curl -s https://imw-msk-assesment.vercel.app/api/health | jq . || \
          echo "Checking alternative URL..."
          curl -s https://imw-msk-assesment-pablodds-projects.vercel.app/api/health | jq .
